#配置文件
[lua]
print_route=uart1    -- Lua print() 输出：uart1/uart2/uart3/usb_at
log_route=uart1      -- log 模块输出：uart1/uart2/uart3/usb_at（与 print 独立）

[monitor]
# UART 1..3: reset if no RX data within N minutes (per-port or all via u_ndata)
u_ndata=0
u1_ndata=0
u2_ndata=0
u3_ndata=0
# Net channel 1..4: reset if no downlink MSG within N minutes (matches [sock.1]..[sock.4])
ch_ndata=0
ch1_ndata=0
ch2_ndata=0
ch3_ndata=0
ch4_ndata=0
# Net channel 1..4: reset if still disconnected when conn timer expires (ONLINE refreshes timer)
ch_conn=0
ch1_conn=0
ch2_conn=0
ch3_conn=0
ch4_conn=0
# Reset if not registered on network when timer expires (registered state refreshes timer)
reg=0