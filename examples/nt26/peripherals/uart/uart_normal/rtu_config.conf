#配置文件
[lua]
print_route=uart1    -- Lua print() 输出：uart1/uart2/uart3/usb_at
log_route=uart1      -- log 模块输出：uart1/uart2/uart3/usb_at（与 print 独立）

[uart.1]
baudrate=115200
data_bits=8
stop_bits=1
parity=0
max_packet_size=256    -- 单包上限，满则切包
max_wait_ms=50         -- 空闲超时断包，单位毫秒
max_packets=4          -- 待处理包邮箱深度
