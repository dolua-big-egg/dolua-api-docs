# SPI 外挂 Flash 时必须把 UART2 从默认脚挪走，否则和 SPI0 抢脚。
# pin_map=1 → UART2 改到 pad 21/22；日志改走 UART2（print_route/log_route=2）。

[lua]
print_route=2    # Lua print() 输出串口，1/2/3
log_route=2      # log 模块输出串口，1/2/3（与 print 独立）

[uart.2]
pin_map=1

[monitor]
# UART 1..3: reset if no RX data within N minutes (per-port or all via u_ndata)
u_ndata=0
u1_ndata=0
u2_ndata=0
u3_ndata=0
# Net channel 1..4: reset if no downlink MSG within N minutes (matches [sock.1]..[sock.4])
ch_ndata=0
ch1_ndata=0
ch2_ndata=0
ch3_ndata=0
ch4_ndata=0
# Net channel 1..4: reset if still disconnected when conn timer expires (ONLINE refreshes timer)
ch_conn=0
ch1_conn=0
ch2_conn=0
ch3_conn=0
ch4_conn=0
# Reset if not registered on network when timer expires (registered state refreshes timer)
reg=0
