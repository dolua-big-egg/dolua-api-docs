# SPI0 固定脚：pin66 GPIO8=CS, pin67 MOSI, pin28 MISO, pin29 SCLK，和 UART2 默认脚重叠。
# 必须把 UART2 从默认脚挪走，否则和 SPI0 抢脚。
# pin_map=1 → UART2 改到 pad 21/22；日志若走 UART2 再配 print_route/log_route=uart2。

[lua]
print_route=uart1    # Lua print() 输出：uart1/uart2/uart3/usb_at
log_route=uart1      # log 模块输出：uart1/uart2/uart3/usb_at（与 print 独立）

[uart.2]
pin_map=1
